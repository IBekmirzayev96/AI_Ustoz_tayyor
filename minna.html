let current=0;

const days=document.getElementById("days");

lessons.forEach((lesson,index)=>{

const button=document.createElement("button");

button.className="day-btn";

button.textContent=index+1;

button.onclick=()=>{
showDay(index);
};

days.appendChild(button);

});


function showDay(index){

current=index;

const lesson=lessons[index];

let cards="";

lesson.rules.forEach((rule,index)=>{

cards+=`

<article class="rule-card">

<div class="rule-title">
${index+1}. ${rule.rule}
</div>

<div class="explain">
${rule.desc}
</div>

<div class="label">
Misol
</div>

<div class="jp">
${rule.jp}
</div>

<div class="romaji">
${rule.romaji}
</div>

<div class="uz">
${rule.uz}
</div>

<div class="controls">

<button onclick='speakText(${JSON.stringify(rule.jp)})'>
🔊 Talaffuz
</button>

</div>

</article>

`;

});


document.getElementById("lesson").innerHTML=`

<div class="badge">
${index+1}-KUN
</div>

<h2>
${lesson.title}
</h2>

<p class="intro">

Bu darsdagi grammatik shakllarni birma-bir o‘rganing.
Avval qoidani o‘qing, keyin yaponcha misolni ovoz chiqarib ayting.
So‘ngra o‘zbekcha ma’nosini tushunishga harakat qiling.

</p>

${cards}

<div class="tip">

💡 <b>O‘rganish maslahati:</b>

Har bir grammatik qoidani alohida yodlashdan ko‘ra,
uning qanday vaziyatda ishlatilishini tushunishga harakat qiling.
Misollarni bir necha marta ovoz chiqarib o‘qish ham foydali.

</div>

<div class="controls">

<button onclick="prevDay()">
← Oldingi
</button>

<button onclick="nextDay()">
Keyingi →
</button>

</div>

<div class="progress">

${index+1} / ${lessons.length}-dars

</div>

`;


document
.querySelectorAll(".day-btn")
.forEach((button,index2)=>{

button.classList.toggle(
"active",
index2===current
);

});


window.scrollTo({
top:document.querySelector(".lesson").offsetTop-10,
behavior:"smooth"
});

}


function nextDay(){

if(current===lessons.length-1){

showDay(0);

}else{

showDay(current+1);

}

}


function prevDay(){

if(current===0){

showDay(lessons.length-1);

}else{

showDay(current-1);

}

}


function speakText(text){

if(!("speechSynthesis" in window)){

alert("Brauzeringiz talaffuz funksiyasini qo‘llab-quvvatlamaydi.");

return;

}

speechSynthesis.cancel();

const voice=new SpeechSynthesisUtterance(text);

voice.lang="ja-JP";

voice.rate=0.85;

speechSynthesis.speak(voice);

}


showDay(0);

</script>
